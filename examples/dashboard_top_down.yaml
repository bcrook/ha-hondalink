# --- 2026 Honda Pilot Top-Down Visualization ---
# 1. Upload an image of your car to /config/www/pilot_top.png
# 2. Add a 'Manual' card to your dashboard and paste this YAML.
# Note: You may need to update the entity IDs (e.g. adding 'driveway_2026_pilot_') 
# to match your specific vehicle setup.

type: picture-elements
image: /local/pilot_top.png
elements:
  # --- Remote Engine Status (Hood) ---
  - type: state-icon
    entity: binary_sensor.hondalink_remote_engine_status
    style:
      top: 15%
      left: 50%
      "--iron-icon-height": 30px
      "--iron-icon-width": 30px
    title: Engine Status

  # --- Main Lock Status (Roof) ---
  - type: state-icon
    entity: lock.hondalink_door_lock
    style:
      top: 50%
      left: 50%
      "--iron-icon-height": 45px
      "--iron-icon-width": 45px

  # --- WINDOWS ---
  - type: state-icon
    entity: binary_sensor.hondalink_front_driver_window_open
    style:
      top: 35%
      left: 28%
  - type: state-icon
    entity: binary_sensor.hondalink_front_passenger_window_open
    style:
      top: 35%
      left: 72%
  - type: state-icon
    entity: binary_sensor.hondalink_rear_left_window_open
    style:
      top: 65%
      left: 28%
  - type: state-icon
    entity: binary_sensor.hondalink_rear_right_window_open
    style:
      top: 65%
      left: 72%

  # --- TIRE PRESSURES (Positioned by the wheels) ---
  - type: state-label
    entity: sensor.hondalink_front_left_tire_pressure
    style:
      top: 25%
      left: 15%
      font-size: 12px
      background-color: "rgba(0,0,0,0.5)"
      padding: 2px
      border-radius: 4px
  - type: state-label
    entity: sensor.hondalink_front_right_tire_pressure
    style:
      top: 25%
      left: 85%
      font-size: 12px
      background-color: "rgba(0,0,0,0.5)"
      padding: 2px
      border-radius: 4px
  - type: state-label
    entity: sensor.hondalink_rear_left_tire_pressure
    style:
      top: 75%
      left: 15%
      font-size: 12px
      background-color: "rgba(0,0,0,0.5)"
      padding: 2px
      border-radius: 4px
  - type: state-label
    entity: sensor.hondalink_rear_right_tire_pressure
    style:
      top: 75%
      left: 85%
      font-size: 12px
      background-color: "rgba(0,0,0,0.5)"
      padding: 2px
      border-radius: 4px

  # --- Status Summary (Bottom) ---
  - type: state-label
    entity: sensor.hondalink_last_update
    style:
      top: 92%
      left: 50%
      font-size: 10px
      opacity: 0.7
